name: Build - Test

on:
  # pull_request:
  #   paths:
  #     - 'services/**'
  #     - 'postman_collections/**'
  #     - 'deploy/**'
  #     - '.github/workflows/**'
  workflow_dispatch:
jobs:
  build-context:
    runs-on: ubuntu-latest
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
  # Resolve the image tag once and expose it as job outputs, so the parallel
  # build matrix and the integration-test job below both consume it without
  # re-deriving it. Same branch logic as before (tag / push-to-branch /
  # push-to-main / workflow_dispatch / pull-request), just computed once.
  meta:
    needs: build-context
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tags.outputs.tag_name }}
      tag_latest: ${{ steps.tags.outputs.tag_latest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get branch name
        id: branch-name
        uses: tj-actions/branch-names@v8
        with:
          strip_tag_prefix: 'v'

      - name: Resolve image tags
        id: tags
        run: |
          IS_TAG='${{ steps.branch-name.outputs.is_tag }}'
          CUR='${{ steps.branch-name.outputs.current_branch }}'
          BASE='${{ steps.branch-name.outputs.base_ref_branch }}'
          TAG='${{ steps.branch-name.outputs.tag }}'
          EVENT='${{ github.event_name }}'
          if [ "$IS_TAG" = 'true' ]; then
            NAME="$TAG";  LATEST="$TAG"
          elif [ "$EVENT" = 'push' ] && [ "$CUR" != 'main' ]; then
            NAME="$CUR";  LATEST="$CUR"
          elif [ "$EVENT" = 'push' ] && [ "$CUR" = 'main' ]; then
            NAME="$CUR";  LATEST='latest'
          elif [ "$EVENT" = 'workflow_dispatch' ]; then
            NAME="$CUR";  LATEST="$CUR"
          else
            # pull_request (and any other non-push trigger): use the PR target
            NAME="$BASE"; LATEST="$BASE"
          fi
          echo "tag_name=$NAME"     >> "$GITHUB_OUTPUT"
          echo "tag_latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Resolved tags -> name='$NAME' latest='$LATEST' (event=$EVENT)"

  # PARALLEL build — one runner per service, all at once. Wall-clock build time
  # drops from the SUM of all 7 builds to roughly the single slowest build.
  # fail-fast:false so one service breaking still lets the others finish, so a
  # single run surfaces every failure. Each job warms its own type=gha cache
  # scope, which the integration-test job reuses.
  build:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: identity,  context: ./services/identity,        image: crapi/crapi-identity,  scope: identity-service }
          - { name: workshop,  context: ./services/workshop,        image: crapi/crapi-workshop,  scope: workshop-service }
          - { name: chatbot,   context: ./services/chatbot,         image: crapi/crapi-chatbot,   scope: chatbot-service }
          - { name: community, context: ./services/community,       image: crapi/crapi-community, scope: community-service }
          - { name: web,       context: ./services/web,             image: crapi/crapi-web,       scope: web-service }
          - { name: gateway,   context: ./services/gateway-service, image: crapi/gateway-service, scope: gateway-service }
          - { name: mailhog,   context: ./services/mailhog,         image: crapi/mailhog,         scope: mailhog-service }
    name: build (${{ matrix.name }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v3
        with:
          context: ${{ matrix.context }}
          tags: ${{ matrix.image }}:${{ needs.meta.outputs.tag_latest }},${{ matrix.image }}:${{ needs.meta.outputs.tag_name }}
          push: false
          load: true
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  # Runs only after ALL matrix builds succeed. Reconstitutes every image from
  # the warm caches the matrix populated (cache HITS, near-instant), then brings
  # the whole stack up and runs the Postman/Newman smoke test against it.
  # A separate job is required because matrix builds run on separate runners —
  # their locally-loaded images don't land together for `docker compose up`.
  integration-test:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Reconstitute all service images from warm cache
        env:
          TAG_NAME: ${{ needs.meta.outputs.tag_name }}
          TAG_LATEST: ${{ needs.meta.outputs.tag_latest }}
        run: |
          set -e
          while IFS='|' read -r dir image scope; do
            [ -z "$dir" ] && continue
            echo "=== $image  (cache scope: $scope) ==="
            docker buildx build --load --platform linux/amd64 \
              --cache-from "type=gha,scope=$scope" \
              -t "$image:$TAG_LATEST" -t "$image:$TAG_NAME" \
              "./services/$dir"
          done <<'SERVICES'
          identity|crapi/crapi-identity|identity-service
          workshop|crapi/crapi-workshop|workshop-service
          chatbot|crapi/crapi-chatbot|chatbot-service
          community|crapi/crapi-community|community-service
          web|crapi/crapi-web|web-service
          gateway-service|crapi/gateway-service|gateway-service
          mailhog|crapi/mailhog|mailhog-service
          SERVICES

      - name: Show all images built
        run: docker images

      - name: Cleanup docker before running
        if: always()
        continue-on-error: true
        run:  docker compose -f deploy/docker/docker-compose.yml down --volumes --remove-orphans

      - name: Run crAPI using built images
        run: |
             cd deploy/docker
             VERSION=${{ needs.meta.outputs.tag_name }} docker compose -f docker-compose.yml --compatibility up -d

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install newman
        run: npm install -g newman

      - name: Run Postman Collection
        run: newman run "./postman_collections/crAPI.postman_collection.json" -e ./postman_collections/crAPI.postman_environment.json --verbose

      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v2

      - name: Cleanup docker
        if: always()
        run:  docker compose -f deploy/docker/docker-compose.yml down --volumes --remove-orphans


  tests:
    needs: build-context
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Start the database
        run: docker compose -f services/docker-database.yml up -d --wait

      - name: Run identity tests
        run: |
          cd services/identity
          ./gradlew test

      - name: Run community tests
        run: |
          cd services/community
          go test -v ./...
          mkdir test-results
          go run gotest.tools/gotestsum@latest --format testname --junitfile test-results/unit-tests.xml

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          # Require: The version of golangci-lint to use.
          # When `install-mode` is `binary` (default) the value can be v1.2 or v1.2.3 or `latest` to use the latest version.
          # When `install-mode` is `goinstall` the value can be v1.2.3, `latest`, or the hash of a commit.
          version: v2.2.1
          working-directory: services/community


      - name: Install system dependencies for workshop
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev

      - name: Run workshop tests
        run: |
          cd services/workshop
          pip3 install virtualenv
          virtualenv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install setuptools>=70.0.0
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
          mkdir -p test-results
          source .env
          IS_TESTING=True python3 manage.py test --no-input --testrunner xmlrunner.extra.djangotestrunner.XMLTestRunner

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            **/test-results/**/*.xml
            **/test-results/**/*.json

      - name: Run workshop coverage
        run: |
          cd services/workshop
          source venv/bin/activate
          source .env
          IS_TESTING=True coverage run ./manage.py test --no-input crapi
          coverage report
          coverage xml -o coverage.xml

      - name: Publish Coverage for workshop
        uses: orgoro/coverage@v3.2
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
            coverageFile: services/workshop/coverage.xml
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: node prettier
        run: |
          cd services/web
          npm install
          npm run lint

  # Secret scanning (gitleaks). fetch-depth: 0 so the WHOLE git history is
  # scanned, not just the current files — a secret removed in a later commit is
  # still leaked. Runs in parallel with build/tests (it doesn't gate them) and
  # fails the run on any finding. Uses the gitleaks CLI rather than
  # gitleaks-action because the action can only write SARIF; this writes JSON.
  # Secrets are redacted in the log and in the `gitleaks-results` artifact.
  secret-scan:
    needs: build-context
    runs-on: ubuntu-latest
    name: secret-scan (gitleaks)
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$url/$tarball"
          curl -sSfL "$url/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: gitleaks git --redact --verbose --report-format json --report-path gitleaks-results.json

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks-results.json

  # SAST (Semgrep). Scans the code of every service (Java, Go, Python, JS/TS)
  # plus the Dockerfiles, k8s manifests and workflows with Semgrep's p/default
  # ruleset. Runs in parallel with build/tests and fails the run on any finding
  # (--error). Findings are printed in the log and saved as JSON in the
  # `semgrep-results` artifact.
  sast:
    needs: build-context
    runs-on: ubuntu-latest
    name: sast (semgrep)
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.183.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run semgrep
        run: semgrep scan --config p/default --metrics off --error --json-output=semgrep-results.json

      - name: Upload semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  # Dockerfile scanning (Checkov). Checks the Dockerfiles every service image is
  # built from (non-root USER, HEALTHCHECK, no apt, ...). Checkov can only scan
  # built images with a paid Prisma Cloud key, so this scans the image
  # definitions instead. Runs in parallel with build/tests and fails the run on
  # any failed check; the JSON report is the `checkov-results` artifact.
  dockerfile-scan:
    needs: build-context
    runs-on: ubuntu-latest
    name: dockerfile-scan (checkov)
    permissions:
      contents: read
    container:
      image: bridgecrew/checkov:3.4.3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run checkov
        run: checkov -d . --framework dockerfile --quiet --compact -o cli -o json --output-file-path console,checkov-results.json

      - name: Upload checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: checkov-results.json
